name: IPF PXD010965 public PRIDE result feasibility audit
# External data research is opt-in; routine PR CI uses offline evidence tests.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check script syntax
        run: python -m py_compile projects/ipf_pxd010965/audit.py
      - name: Audit public PRIDE metadata and file list
        run: python projects/ipf_pxd010965/audit.py --out output/ipf_pxd010965
      - name: Inspect small public Proteins.csv when accessible
        run: python projects/ipf_pxd010965/inspect_quant.py --out output/ipf_pxd010965_quant
      - name: Install exploratory analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scipy>=1.12,<2' 'statsmodels>=0.14,<1'
      - name: Independent protein raw-intensity and normalization sensitivity audit
        run: python projects/ipf_pxd010965/analyze_proteins.py --input output/ipf_pxd010965_quant/Proteins_public_source.csv --out output/ipf_pxd010965_reanalysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipf-pxd010965-public-audit
          path: |
            output/ipf_pxd010965/
            output/ipf_pxd010965_quant/
            output/ipf_pxd010965_reanalysis/
          retention-days: 60