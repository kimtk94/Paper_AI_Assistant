name: Endometriosis GSE283755 public GEO audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/endometriosis_gse283755/**'
      - '.github/workflows/endometriosis-geo-audit.yml'
permissions:
  contents: read
jobs:
  public-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/endometriosis_gse283755/requirements.txt
      - run: pip install -r projects/endometriosis_gse283755/requirements.txt
      - name: Inspect GEO processed matrix
        run: python projects/endometriosis_gse283755/run.py --output output/endometriosis_gse283755
      - name: Upload audit outputs (no raw XLSX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse283755-qc-audit
          path: |
            output/endometriosis_gse283755/REPORT.md
            output/endometriosis_gse283755/audit.json
            output/endometriosis_gse283755/sheet_inventory.json
            output/endometriosis_gse283755/*_qc.csv
            output/endometriosis_gse283755/exploratory_gene_effects.csv
            output/endometriosis_gse283755/pca_samples.csv
            output/endometriosis_gse283755/candidate_direction_checks.csv
          if-no-files-found: warn
          retention-days: 30