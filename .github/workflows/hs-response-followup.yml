name: HS 14-pair response-stratified sensitivity
# Computationally expensive, external-data workflows must be launched intentionally.
# PRs run the lightweight research-static-checks workflow instead.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hs-response-stratified:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy / pandas
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Recover verified 59/59 GSM sample-to-count mapping
        run: python projects/top7_remaining4/refine.py --role hs_therapy --out output/hs_response_followup
      - name: Assert mapping and matched response status before modeling
        run: |
          python - <<'PY'
          import json,sys
          q=json.load(open('output/hs_response_followup/REFINED_QC.json'))
          assert q.get('explicit_column_map_n')==59 and q.get('lesional_pairs')==14
          assert q.get('paired_model_input')=='READY_COUNT_VERIFIED'
          print('Strict QC PASS',q['explicit_column_map_n'],q['lesional_pairs'])
          PY
      - name: Install DESeq2
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y r-bioc-deseq2
      - name: Compare baseline and response-by-time gene effects
        run: Rscript projects/hs_followup/response_interaction.R output/hs_response_followup
      - name: Exact 7 vs 7 permutation of paired gene changes
        run: python projects/hs_followup/paired_delta_permutation.py --out output/hs_response_followup
      - name: Remove raw or sample-level matrices from artifact
        if: always()
        run: |
          rm -f output/hs_response_followup/hs_therapy_paired_counts.csv
          rm -f output/hs_response_followup/hs_targets_log2_normalized_counts.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hs-response-stratified-public-exploration
          path: |
            output/hs_response_followup/hs_response_time_interaction_deseq2.csv
            output/hs_response_followup/hs_nonresponders_time_change_deseq2.csv
            output/hs_response_followup/hs_pre_response_group_deseq2.csv
            output/hs_response_followup/hs_targeted_interaction_baseline.csv
            output/hs_response_followup/hs_targeted_exact_permutation_7v7.csv
            output/hs_response_followup/hs_response_model_summary.csv
            output/hs_response_followup/RESPONSE_MODEL_QC.md
            output/hs_response_followup/HS_EXACT_PERMUTATION_REPORT.md
            output/hs_response_followup/REFINED_QC.json
          if-no-files-found: warn
          retention-days: 45