name: HS GSE294009 donor mapping and file inventory
on:
  pull_request:
    paths:
      - 'projects/hs_spatial_gse294009/**'
      - '.github/workflows/hs-spatial-gse294009-probe.yml'
  workflow_dispatch:
jobs:
  spatial-geo-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax and parse GEO metadata
        run: |
          python -m py_compile projects/hs_spatial_gse294009/geo_file_probe.py
          python projects/hs_spatial_gse294009/geo_file_probe.py --out output/hs_spatial_gse294009
      - name: Inspect DCC and PKC formats from GEO original files
        run: |
          python -m py_compile projects/hs_spatial_gse294009/dcc_probe.py
          python projects/hs_spatial_gse294009/dcc_probe.py --out output/hs_spatial_gse294009
      - name: Reconstruct targeted gene counts from DCC and PKC (204 ROIs, descriptive only)
        run: |
          python -m py_compile projects/hs_spatial_gse294009/reconstruct_roi_counts.py
          python projects/hs_spatial_gse294009/reconstruct_roi_counts.py --out output/hs_spatial_gse294009
      - name: Check slide and Q3 dependence without donor-level p-values
        run: |
          python -m py_compile projects/hs_spatial_gse294009/source_sensitivity.py
          python projects/hs_spatial_gse294009/source_sensitivity.py --out output/hs_spatial_gse294009
      - name: Author S2 explicit donor-aware sensitivity (no ROI pseudo-replication)
        run: |
          python -m py_compile projects/hs_spatial_gse294009/author_s2_donor_sensitivity.py
          python projects/hs_spatial_gse294009/author_s2_donor_sensitivity.py --out output/hs_spatial_gse294009
      - name: Check exploratory LOQ/Q3/Q90 robustness without patient pseudo-replication
        run: |
          python -m py_compile projects/hs_spatial_gse294009/loq_q3_robustness.py
          python projects/hs_spatial_gse294009/loq_q3_robustness.py --input output/hs_spatial_gse294009 --out output/hs_loq_sensitivity
      - name: Fail closed on missing provenance or invalid inferential claims
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path('output/hs_loq_sensitivity')
          a=json.loads((p/'HS_LOQ_Q3_Q90_AUDIT.json').read_text())
          assert a['source_accession']=='GSE294009'
          assert (a['n_geo_roi'],a['n_hs_s2_roi'],a['n_hs_donors'])==(204,132,15)
          assert a['status']=='SOURCE_LOQ_PROXY_AUDITED__PATIENT_DESCRIPTIVE_ONLY'
          assert a['analysis']['p_values_computed'] is False
          assert a['analysis']['FDR_computed'] is False
          assert a['n_focus_gene_comparisons']==24
          with (p/'HS_QC_CANDIDATE_DECISION.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==24
          assert all(r['LOQ_method']=='EXPLORATORY_GEOMEAN_x_GEOSD2_CLAMP1' for r in rows)
          print('PASS_NEGATIVE_PROBE_QC',a['n_hs_roi_with_negative_probe_loq'],'of 132 HS ROI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hs-spatial-gse294009-file-and-donor-inventory
          path: |
            output/hs_spatial_gse294009/
            output/hs_loq_sensitivity/
          retention-days: 45
          if-no-files-found: warn