name: HS Spatial article supplementary donor mapping audit
on:
  pull_request:
    paths:
      - 'projects/hs_spatial_gse294009/paper_supp_linkage.py'
      - '.github/workflows/hs-spatial-supplement-linkage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-supplement-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile projects/hs_spatial_gse294009/paper_supp_linkage.py
      - name: Resolve publication supplements and provenance
        run: python projects/hs_spatial_gse294009/paper_supp_linkage.py --out output/hs_spatial_supp
      - name: Publish bounded public evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hs-spatial-publication-supplement-linkage
          path: output/hs_spatial_supp/
          retention-days: 30