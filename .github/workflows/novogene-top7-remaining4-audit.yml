name: Novogene Top 7 remaining four public data baseline
# Computationally expensive, external-data workflows must be launched intentionally.
# PRs run the lightweight research-static-checks workflow instead.
on:
  workflow_dispatch:
jobs:
  public-dataset-audit:
    strategy:
      fail-fast: false
      matrix:
        role: [hs_therapy, musk_mg, nmosd, hs_spatial]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-data reader
        run: python -m pip install pandas==2.2.3
      - name: Run public GEO scientific design audit
        run: python projects/top7_remaining4/geo_baseline.py --role '${{ matrix.role }}' --out 'output/top7_remaining4/${{ matrix.role }}'
      - name: Refine patient/ROI and candidate matrix mapping
        run: python projects/top7_remaining4/refine.py --role '${{ matrix.role }}' --out 'output/top7_remaining4/${{ matrix.role }}'
      - name: Install DESeq2 only for verified HS paired lesion samples
        if: matrix.role == 'hs_therapy'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y r-bioc-deseq2
      - name: Paired HS anti-TNF lesion DESeq2
        if: matrix.role == 'hs_therapy'
        run: Rscript projects/top7_remaining4/hs_paired_deseq2.R output/top7_remaining4/hs_therapy
      - name: Remove raw matrices from CI artifact
        if: matrix.role == 'hs_therapy'
        run: rm -f output/top7_remaining4/hs_therapy/hs_therapy_paired_counts.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top7-${{ matrix.role }}-public-audit
          path: output/top7_remaining4/${{ matrix.role }}/
          if-no-files-found: warn
          retention-days: 45