name: Endometriosis offline evidence guards
on:
  pull_request:
    paths:
      - 'projects/endometriosis_gse283755/**'
      - 'projects/endometriosis_gse283755_validation/**'
      - 'tests/test_endometriosis_evidence.py'
      - '.github/workflows/endometriosis-evidence-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m compileall -q projects/endometriosis_gse283755 projects/endometriosis_gse283755_validation
      - run: python -m unittest discover -s tests -p 'test_endometriosis_evidence.py' -v
