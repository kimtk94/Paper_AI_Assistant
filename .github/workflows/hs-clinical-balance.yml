name: HS public treatment response clinical balance
on:
  pull_request:
    paths:
      - 'projects/hs_followup/clinical_covariate_qc.py'
      - '.github/workflows/hs-clinical-balance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-clinical-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Fetch GEO sample design
        run: python projects/top7_remaining4/geo_baseline.py --role hs_therapy --out output/hs_clinical_balance
      - name: Audit covariates for 14 matched subjects only
        run: python projects/hs_followup/clinical_covariate_qc.py --design output/hs_clinical_balance/GSE213761_sample_design.csv --out output/hs_clinical_balance
      - name: Prevent uploading individual-level GEO clinical data
        run: rm -f output/hs_clinical_balance/GSE213761_sample_design.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hs-14-patient-public-covariate-balance
          path: |
            output/hs_clinical_balance/HS_CLINICAL_BALANCE_REPORT.md
            output/hs_clinical_balance/hs_response_public_clinical_balance.csv
          retention-days: 45